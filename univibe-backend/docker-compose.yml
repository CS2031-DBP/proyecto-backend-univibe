services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: univibe
      POSTGRES_USER: univibe
      POSTGRES_PASSWORD: univibe
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/univibe
      SPRING_DATASOURCE_USERNAME: univibe
      SPRING_DATASOURCE_PASSWORD: univibe
    ports:
      - "8080:8080"
volumes:
  db-data:
